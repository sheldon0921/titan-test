# data/login_cases.yaml

- title: "登录成功_正常数据"
  payload:
    username: "admin"
    password: "123"
  expected:
    status_code: 200
    msg: "success"

- title: "登录失败_密码错误"
  payload:
    username: "admin"
    password: "wrong_password"
  expected:
    status_code: 200  # httpbin 只能返回 200，真实接口这里可能是 401
    msg: "fail"

- title: "登录失败_用户名为空"
  payload:
    username: ""
    password: "123"
  expected:
    status_code: 200
    msg: "error"