name: Titan Automated Tests  # 流水线名称

# 1. 触发条件：当推送到 main 或 master 分支时触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 2. 定义任务
jobs:
  build-and-test:
    # 指定运行环境：使用 GitHub 提供的最新 Ubuntu 虚拟机
    runs-on: ubuntu-latest

    # 3. 具体步骤
    steps:
    # (1) 拉取代码 (相当于 git clone)
    - name: Checkout code
      uses: actions/checkout@v4

    # (2) 搭建 Python 环境
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    # (3) 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # (4) 创建报告目录 (防止 pytest 报错)
    - name: Create report directory
      run: mkdir -p reports

    # (5) 运行测试
    # 这里的 env 是读取 GitHub 仓库里配置的“秘密变量” (Secrets)
    - name: Run Pytest
      env:
        ENV: dev  # 也可以直接写死，或者用变量
        # NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }} # 如果你需要发通知
      run: |
        # 运行测试，生成 Allure 数据，即使失败也不立刻报错 (|| true) 以便后续上传报告
        pytest --alluredir=./reports || true

    # (6) 上传测试报告 (Artifacts)
    # 这样你可以在 GitHub 网页上下载这一轮的测试报告
    - name: Upload Test Reports
      if: always()  # 无论测试成功还是失败，都执行这一步
      uses: actions/upload-artifact@v4
      with:
        name: allure-reports
        path: reports/
        retention-days: 3