name: Titan Automated Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create report directory
      run: mkdir -p reports

    - name: Run Pytest
      id: test_step  # 👈 给这个步骤起个 ID，方便后面判断状态
      env:
        ENV: dev
      run: |
        # 运行测试，|| true 确保即使失败也会继续执行后面的步骤
        pytest --alluredir=./reports || true

    # --- 新增步骤：发送钉钉通知 ---
    - name: Send DingTalk Notification
      if: always() # 👈 无论测试成功还是失败，都执行这一步
      env:
        NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }} # 读取 GitHub Secret
        CI_PIPELINE_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      run: |
        # 判断测试步骤是否成功
        if [ "${{ steps.test_step.outcome }}" == "success" ]; then
          STATUS="success"
        else
          STATUS="failed"
        fi
        
        echo "发送通知，状态: $STATUS"
        python lib/notify.py $STATUS

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-reports
        path: reports/
        retention-days: 3