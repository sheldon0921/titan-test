# 基础镜像
image: docker:latest

# 开启 Docker-in-Docker 服务 (必须)
services:
  - docker:dind

# 全局变量
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""  # 禁用 TLS 验证，防止证书报错

stages:
  - test

# --- 核心任务 ---
automation-test:
  stage: test
  # 指定你的 Runner 标签 (注册 Runner 时填的 tag 是 docker)
  tags:
    - docker

  allow_failure: false

  before_script:
    - docker info
    - echo "🏗️ 准备构建镜像..."

  script:
    # ⚠️ 注意：下面每一行命令前面都有一个 "- " (减号+空格)
    # 1. 构建镜像
    - docker build -t titan-test .

    # 2. 创建目录
    - mkdir -p reports

    # 3. 运行测试
    # 使用 || EXIT_CODE=$? 来捕获错误码，防止脚本直接中断
    - echo "🚀 开始运行测试..."
    - docker run --rm -e ENV=$ENV -v $PWD/reports:/app/reports titan-test pytest --alluredir=/app/reports || EXIT_CODE=$?

    # 4. 根据之前的错误码判断是否失败
    - if [ "$EXIT_CODE" != "0" ]; then echo "❌ 测试执行失败"; exit 1; fi

  after_script:
    - echo "🔔 正在发送通知..."
    # 再次启动容器发送通知
    - |
      docker run --rm \
      -e NOTIFY_WEBHOOK=$NOTIFY_WEBHOOK \
      -e CI_PIPELINE_URL=$CI_PIPELINE_URL \
      titan-test python lib/notify.py $CI_JOB_STATUS

  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 3 days